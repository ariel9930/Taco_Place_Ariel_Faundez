<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Ariel Faundez">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Document</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="imagen">
                <img src="static/img/logo.png" alt="Taco">
                <h1><span class="Taco">Taco</span>Palace</h1>
            </div>
            <div class="barrita_buscar">
                <input type="text" placeholder="email">
                <button class="login">Login</button>
                <div class="carrito"></div>
                <img src="static/img/carrito.png" alt="carrito">
                <span class="carrito_numero" id="carrito_numero">0</span>
            </div>
        </nav>
    </header>
    <main class="container">
        <section class="comidas">
            <div class="comiditas">
                <img src="static/img/enchiladas.jpg" alt="enchiladas">
                <p>Enchiladas</p>
            </div>

            <div class="comiditas">
                <img src="static/img/tacos.jpg" alt="enchiladas">
                <p>Tacos</p>
            </div>

            <div class="comiditas">
                <img src="static/img/flautas.jpg" alt="enchiladas">
                <p>Flautas</p>
            </div>

            <div class="comiditas">
                <img src="static/img/gorditas.jpg" alt="enchiladas">
                <p>Gorditas</p>
            </div>

            <div class="comiditas">
                <img src="static/img/tostadas.jpg" alt="enchiladas">
                <p>Tostadas</p>
            </div>

            <div class="comiditas">
                <img src="static/img/enfrijoladas.jpg" alt="enchiladas">
                <p>Enfrijoladas</p>
            </div>
        </section>
        <section class="info">
            <div class="Lamejor_variedad">
                <h1>La mejor<br>variedad en<br>platillos de<br>comida<br>mexicana</h1>
                <h2>contactanos con<br> <a href="#">servicio</a> a<br> <span class="domicilio">domicilio</span></h2>
            </div>

            <div class="comida-mexicana">
                <img src="static/img/comida-mexicana.jpg" alt="comida-mexicana">
            </div>
            <div class="Recomendados">
                <h1>Recomendados:</h1>
                <img src="static/img/orden-tacos.jpg" alt="orden-flautas">
                <p>Orden de tacos</p>
                <p><a href="#">Ver Más</a></p>
                <button class="+">+</button>

            <div class="Recomendados">
                <img src="static/img/orden-flautas.jpg" alt="orden-flautas">
                <p>Orden de flautas</p>
                <p><a href="#">Ver Más</a></p>
                <button class="+">+</button>
            </div>
        </section>

    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
